<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Utama Saya</title>
    
    <!-- Bagian CSS untuk mempercantik tampilan -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 50px;
            text-align: center;
        }
        .container {
            background-color: #ffffff;
            max-width: 600px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #333333;
        }
        p {
            color: #666666;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <!-- Bagian konten yang akan terlihat di browser -->
    <div class="container">
        <h1>Selamat Datang di Website Saya!</h1>
        <p>Ini adalah contoh halaman index HTML sederhana. Anda dapat menggunakan ini sebagai kerangka awal untuk membangun website Anda.</p>
        <p>Silakan edit teks ini dan tambahkan elemen lain seperti gambar, tabel, atau formulir sesuai kebutuhan.</p>
        
        <a href="#" class="btn">Pelajari Lebih Lanjut</a>
    </div>

</body>
</html>
